name: Build (PyInstaller)

on:
  workflow_dispatch:        # allow manual builds
  push:
    tags: ["v*"]            # build on version tags

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ffmpeg -y || echo "ffmpeg install skipped"
          echo "C:\ProgramData\chocolatey\bin" >> "$GITHUB_PATH"

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Locate ffmpeg for bundling
        shell: bash
        run: |
          FFMPEG_PATH="$(command -v ffmpeg || true)"
          echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "Found ffmpeg at: ${FFMPEG_PATH:-none}"

      - name: Build with PyInstaller
        env:
          FFMPEG_PATH: ${{ env.FFMPEG_PATH }}
        run: pyinstaller --clean --noconfirm packaging/universal-downloader.spec

      - name: Collect artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp -r dist/universal-downloader release/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp -r dist/universal-downloader release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-downloader-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
