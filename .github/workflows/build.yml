name: Build (PyInstaller)

on:
  workflow_dispatch:        # allow manual builds
  push:
    tags: ["v*"]            # build on version tags

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ffmpeg -y || echo "ffmpeg install skipped"
          echo "C:\ProgramData\chocolatey\bin" >> "$GITHUB_PATH"

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Locate ffmpeg for bundling
        shell: bash
        run: |
          FFMPEG_PATH="$(command -v ffmpeg || true)"
          echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "Found ffmpeg at: ${FFMPEG_PATH:-none}"

      - name: Build with PyInstaller
        env:
          FFMPEG_PATH: ${{ env.FFMPEG_PATH }}
        run: pyinstaller --clean --noconfirm packaging/universal-downloader.spec

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf "release/universal-downloader-${RELEASE_VERSION}-linux-x86_64.tar.gz" -C dist universal-downloader

      - name: Package macOS archive
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          tar -czf "release/universal-downloader-${RELEASE_VERSION}-macos-universal.tar.gz" -C dist universal-downloader

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cd dist
          7z a -tzip "universal-downloader-${RELEASE_VERSION}-windows-x86_64.zip" universal-downloader
          mv "universal-downloader-${RELEASE_VERSION}-windows-x86_64.zip" ../release/

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: universal-downloader-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/*.zip artifacts/*.tar.gz)
          echo "Uploading ${#files[@]} archives:"
          for f in "${files[@]}"; do echo "  - $f"; done

          cat > /tmp/release-notes.md <<'EOF'
          Cross-platform build of Universal Downloader.

          ## Download for your platform
          - **Windows**: the `.zip` ending in `windows-x86_64` (extract and run `universal-downloader.exe`)
          - **Linux**: the `.tar.gz` ending in `linux-x86_64` (extract and run `universal-downloader`)
          - **macOS**: the `.tar.gz` ending in `macos-universal` (extract and run `universal-downloader`)

          Extract the folder and run the executable. First launch may take a few seconds.
          EOF

          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Universal Downloader ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            "${files[@]}"
